name: Publish build stats

# Replaces the Ubuntu cron (life/tools/publish-and-push-stats.sh). That
# box sits on an isolated 10.0.0.0/24 segment with no route out, so its
# hourly commits piled up locally and the site's numbers froze while the
# machine looked healthy. Running here means the job cannot be cut off
# by the home network at all.
#
# NEEDS SECRET: REPO_PAT - a fine-grained PAT with Contents:read on
# bw9009/life and bw9009/envelope-print, and Contents:write on
# bw9009/lifeos-site. The default GITHUB_TOKEN cannot see other repos,
# and `life` is private.
#
# Schedule note: GitHub's cron is best-effort and hourly runs are often
# a few minutes late, occasionally skipped under load. That is fine for
# a counter; do not read a missing run as a broken job.

on:
  schedule:
    - cron: '0 * * * *'
  # Sent by bw9009/life on every push to master. Polling once an hour
  # meant the numbers could sit stale that long, and the test suite -
  # the expensive half - only re-ran when the hourly check happened to
  # notice. This makes the update follow the work. The cron stays as a
  # safety net: a missed event costs freshness, not correctness.
  repository_dispatch:
    types: [life-updated]
  workflow_dispatch:
    inputs:
      force_tests:
        description: 'Run the suite even if life has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout reports a missing secret as "Input required and
      # not supplied: token", which says nothing about WHICH input or
      # why. Fail here instead, with the actual cause and the fix.
      - name: Check REPO_PAT exists
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "$REPO_PAT" ]; then
            echo "::error::REPO_PAT is empty. The secret must live on THIS repo"
            echo "::error::(bw9009/lifeos-site) under Settings > Secrets and variables"
            echo "::error::> Actions > Repository secrets - not Dependabot, not"
            echo "::error::Codespaces, not an Environment secret - and be named"
            echo "::error::exactly REPO_PAT."
            exit 1
          fi
          echo "REPO_PAT present (${#REPO_PAT} chars)"

      - name: Checkout site
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0

      # fetch-depth: 0 everywhere on purpose - the stats are commit
      # COUNTS and first-commit dates. A shallow clone would publish a
      # confidently wrong number rather than fail.
      - name: Checkout life
        uses: actions/checkout@v4
        with:
          repository: bw9009/life
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0
          path: _repos/life

      - name: Checkout envelope-print
        uses: actions/checkout@v4
        with:
          repository: bw9009/envelope-print
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0
          path: _repos/envelope-print

      - name: Checkout lifeos-site (as a counted repo)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 0
          path: _repos/lifeos-site

      - name: Decide whether the test suite needs re-running
        id: decide
        run: |
          life_sha="$(git -C _repos/life rev-parse HEAD)"
          prev="$(grep -oE '"lifeSha": *"[^"]*"' stats.json 2>/dev/null \
                  | sed -E 's/.*"lifeSha": *"([^"]*)".*/\1/')"
          echo "life_sha=$life_sha" >> "$GITHUB_OUTPUT"
          # Diagnosing the test step needs the test step to actually
          # run, and it is skipped precisely when nothing has changed -
          # which is the state you are always in while debugging it.
          if [ "${{ inputs.force_tests }}" = "true" ]; then
            echo "run_tests=1" >> "$GITHUB_OUTPUT"
            echo "forced by workflow_dispatch"
            exit 0
          fi
          if [ "$life_sha" = "$prev" ]; then
            echo "run_tests=0" >> "$GITHUB_OUTPUT"
            echo "life unchanged ($life_sha) - carrying previous test counts"
          else
            echo "run_tests=1" >> "$GITHUB_OUTPUT"
            echo "life moved: $prev -> $life_sha - re-running tests"
          fi

      - name: Set up Flutter
        if: steps.decide.outputs.run_tests == '1'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build stats.json
        env:
          RUN_TESTS: ${{ steps.decide.outputs.run_tests }}
          LIFE_SHA: ${{ steps.decide.outputs.life_sha }}
        run: |
          chmod +x tools/ci-stats.sh
          ./tools/ci-stats.sh

      - name: Commit if the numbers moved
        run: |
          git config user.name  "stats bot"
          git config user.email "actions@users.noreply.github.com"
          # "updated" changes every run by definition, so committing on
          # any diff would push an empty-news commit every hour. Only
          # commit when a real figure moved.
          if git diff --quiet -- stats.json; then
            echo "no change"; exit 0
          fi
          if [ -z "$(git diff -U0 -- stats.json | grep -E '^\+' | grep -vE '^\+\+\+|"updated"')" ]; then
            echo "only the timestamp changed - not committing"
            git checkout -- stats.json
            exit 0
          fi
          git add stats.json
          git commit -m "Auto-update build stats ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # The job takes minutes (Flutter install + full suite), so master
          # can move under it - any human push during that window makes
          # this a non-fast-forward and the run dies at the last step with
          # the work already done. Rebase and retry instead. stats.json is
          # the only file this job touches and it is regenerated, not
          # merged, so replaying the commit on top is always correct.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected - rebasing on origin/master and retrying"
            git pull --rebase=true --strategy-option=theirs origin master || {
              echo "::error::rebase failed; leaving master alone"; exit 1
            }
          done
          echo "::error::could not push after 3 attempts"
          exit 1
